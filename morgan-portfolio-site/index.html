---
layout: default
title: Home
home: true
---
<section class="hero">
  <h1>hi I’m<br>Morgan</h1>
  <div class="hero-side">
    <p class="invite">Come look at my projects!</p>
    <p class="year">{{ site.time | date: "%Y" }}</p>
  </div>
</section>
<section id="projects" class="tiles">
  {% assign list = site.projects | sort: "order" %}
  {% for p in list %}
  <a class="tile" href="{{ p.url | relative_url }}">
    <img src="{{ '/assets/img/' | append: p.cover | relative_url }}" alt="{{ p.title }}" loading="lazy">
    <div class="title-band">
      <h2>{{ p.title }}</h2>
      <p class="meta">{{ p.meta }}</p>
      <p class="tags">{{ p.tags | join: ", " }}</p>
    </div>
  </a>
  {% endfor %}
</section>
