<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.home != true %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="{{ page.layout }}">
  {% unless page.home %}
  <header class="bar"><a class="name" href="{{ '/' | relative_url }}">Morgan Chang</a>
    <nav><a href="{{ '/#projects' | relative_url }}">Projects</a><a href="{{ '/assets/Resume-Morgan-Chang.pdf' | relative_url }}">Resume</a></nav>
  </header>
  {% endunless %}
  <main>{{ content }}</main>
  <footer id="contact">
    <p class="foot-title">{{ site.tagline }}</p>
    <p><a href="mailto:{{ site.email }}">{{ site.email }}</a>
      <span class="sep">|</span><a href="{{ '/assets/Resume-Morgan-Chang.pdf' | relative_url }}">Resume</a>
      <span class="sep">|</span><a href="{{ '/assets/Portfolio-Morgan-Chang.pdf' | relative_url }}">Portfolio (PDF)</a>
      <span class="sep">|</span><a href="{{ site.linkedin }}">LinkedIn</a></p>
  </footer>
</body>
</html>
