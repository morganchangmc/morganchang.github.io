---
layout: default
---
<article class="project">
  <img class="cover" src="{{ '/assets/img/' | append: page.cover | relative_url }}" alt="{{ page.title }}">
  <div class="title-band">
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.meta }}</p>
    <p class="tags">{{ page.tags | join: ", " }}</p>
  </div>
  <div class="content">{{ content }}</div>
  <nav class="back"><a href="{{ '/#projects' | relative_url }}">Back to all projects</a></nav>
</article>
